
[project]
name = "controle-estoque"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.3,<0.18.0)",
    "taskipy (>=1.14.1,<2.0.0)",
     "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=6.0.0,<7.0.0)"

]

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]
preview = true

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = "."
addopts = "-p no:warnings"

[tool.taskipy.tasks]
lint = "ruff check ."
format = 'ruff format'
run = 'fastapi dev controle_estoque/main.py'
pre_test = 'task lint'
test = 'pytest -s -x --cov=controle_estoque -vv'
post_test = 'coverage html'